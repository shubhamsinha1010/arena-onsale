[project]
name = "arena-onsale"
version = "0.1.0"
description = "World Cup-scale ticket onsale: waiting room, hybrid locking, idempotent checkout."
readme = "README.md"
authors = [
    { name = "Shubham Sinha", email = "sinhashubham1911@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
load = [
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires Postgres and Redis",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["INP", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["arena_onsale"]
exclude = ["alembic"]
